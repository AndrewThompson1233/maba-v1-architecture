<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="620">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mabaBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="metaBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hfBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="stdBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="620" rx="14" fill="url(#chartBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(36, 32)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
      Sub-150M Architectural Efficiency Comparison
    </text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Maba v1 vs modern sub-150M edge models: SmolLM2-135M (Hugging Face, 2024), MobileLLM-125M (Meta, 2024)
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(36, 92)">
    <!-- Maba Legend Item -->
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#mabaBar)"/>
    <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Maba v1 (101M)</text>

    <!-- MobileLLM Legend Item -->
    <rect x="170" y="0" width="14" height="14" rx="3" fill="url(#metaBar)"/>
    <text x="192" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">MobileLLM (125M)</text>

    <!-- SmolLM2 Legend Item -->
    <rect x="360" y="0" width="14" height="14" rx="3" fill="url(#hfBar)"/>
    <text x="382" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">SmolLM2 (135M)</text>

    <!-- Standard Transformer Legend Item -->
    <rect x="540" y="0" width="14" height="14" rx="3" fill="url(#stdBar)"/>
    <text x="562" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Dense Baseline (100M)</text>
  </g>

  <!-- Dividing line -->
  <line x1="36" y1="120" x2="884" y2="120" stroke="#1e293b" stroke-width="1"/>

  <!-- Panel 1: Computation Core vs Vocabulary Allocation -->
  <g transform="translate(36, 140)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
      1. Computation Core Allocation (% parameters in transformer core, higher is better)
    </text>

    <!-- Bars for Core % -->
    <!-- Maba v1: 95.2% (max width 540px -> 514px) -->
    <g transform="translate(0, 32)">
      <text x="0" y="14" font-family="monospace" font-size="12" fill="#94a3b8">Maba v1</text>
      <rect x="150" y="0" width="514" height="20" rx="4" fill="url(#mabaBar)"/>
      <text x="674" y="14" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">95.2% (96.3M / 101.2M)</text>
    </g>

    <!-- MobileLLM-125M: 85.3% -> 460px -->
    <g transform="translate(0, 60)">
      <text x="0" y="14" font-family="monospace" font-size="12" fill="#94a3b8">MobileLLM</text>
      <rect x="150" y="0" width="460" height="20" rx="4" fill="url(#metaBar)"/>
      <text x="620" y="14" font-family="monospace" font-size="12" font-weight="500" fill="#cbd5e1">85.3% (106.6M / 125.0M)</text>
    </g>

    <!-- SmolLM2-135M: 79.0% -> 426px -->
    <g transform="translate(0, 88)">
      <text x="0" y="14" font-family="monospace" font-size="12" fill="#94a3b8">SmolLM2</text>
      <rect x="150" y="0" width="426" height="20" rx="4" fill="url(#hfBar)"/>
      <text x="586" y="14" font-family="monospace" font-size="12" font-weight="500" fill="#cbd5e1">79.0% (106.7M / 135.0M)</text>
    </g>

    <!-- Standard Baseline: 79.0% -> 426px -->
    <g transform="translate(0, 116)">
      <text x="0" y="14" font-family="monospace" font-size="12" fill="#94a3b8">Baseline</text>
      <rect x="150" y="0" width="426" height="20" rx="4" fill="url(#stdBar)"/>
      <text x="586" y="14" font-family="monospace" font-size="12" font-weight="500" fill="#cbd5e1">79.0% (79.0M / 100.0M)</text>
    </g>
  </g>

  <!-- Panel 2: Vocabulary Tax (Lower is better) -->
  <g transform="translate(36, 305)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
      2. Vocabulary Parameter Overhead (% parameter tax, lower is better)
    </text>

    <!-- Maba v1: 4.3% -> 23px -->
    <g transform="translate(0, 32)">
      <text x="0" y="14" font-family="monospace" font-size="12" fill="#94a3b8">Maba v1</text>
      <rect x="150" y="0" width="43" height="18" rx="4" fill="url(#mabaBar)"/>
      <text x="203" y="14" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">4.3% (factorized rank 128)</text>
    </g>

    <!-- MobileLLM-125M: 14.7% -> 147px -->
    <g transform="translate(0, 58)">
      <text x="0" y="14" font-family="monospace" font-size="12" fill="#94a3b8">MobileLLM</text>
      <rect x="150" y="0" width="147" height="18" rx="4" fill="url(#metaBar)"/>
      <text x="307" y="14" font-family="monospace" font-size="12" font-weight="500" fill="#cbd5e1">14.7% (32k unfactorized)</text>
    </g>

    <!-- SmolLM2-135M: 21.0% -> 210px -->
    <g transform="translate(0, 84)">
      <text x="0" y="14" font-family="monospace" font-size="12" fill="#94a3b8">SmolLM2</text>
      <rect x="150" y="0" width="210" height="18" rx="4" fill="url(#hfBar)"/>
      <text x="370" y="14" font-family="monospace" font-size="12" font-weight="500" fill="#cbd5e1">21.0% (49k unfactorized)</text>
    </g>
  </g>

  <!-- Panel 3: Side-by-Side Comparison Cards -->
  <g transform="translate(36, 440)">
    <!-- Card 1: Depth -->
    <g transform="translate(0, 0)">
      <rect width="265" height="145" rx="8" fill="#131d2e" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">COMPOSITIONAL DEPTH</text>
      <text x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#38bdf8">40 layers</text>
      <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">20 physical x 2 passes</text>
      <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#64748b">vs 30 (SmolLM2) / 24 (Std)</text>
      <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10b981">+33% deeper reasoning</text>
    </g>

    <!-- Card 2: KV Cache -->
    <g transform="translate(285, 0)">
      <rect width="265" height="145" rx="8" fill="#131d2e" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">KV-CACHE (10k CONTEXT)</text>
      <text x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#6366f1">48.8 MB</text>
      <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">75% GDN-2 (O(1) state)</text>
      <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#64748b">vs 197.8 MB in SmolLM2</text>
      <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10b981">75.3% VRAM reduction</text>
    </g>

    <!-- Card 3: Inference Engine & Speculative -->
    <g transform="translate(570, 0)">
      <rect width="278" height="145" rx="8" fill="#131d2e" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">SPECULATIVE DECODING</text>
      <text x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#a855f7">Built-in</text>
      <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Native MTP Head (k=2)</text>
      <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#64748b">No external draft model</text>
      <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10b981">Zero VRAM overhead</text>
    </g>
  </g>
</svg>
